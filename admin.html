<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Fragrance | Admin Dashboard</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Admin Styles -->
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <aside class="sidebar">
        <h2>ROYAL ADMIN</h2>
        <ul>
            <li><a href="#" class="active" onclick="switchView('products')"><i class="fa-solid fa-box"></i> Products</a>
            </li>
            <li><a href="#" onclick="switchView('orders')"><i class="fa-solid fa-cart-shopping"></i> Orders</a></li>
            <li><a href="#" onclick="switchView('analytics')"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
            <li><a href="#" onclick="switchView('hisab-kitab')"><i class="fa-solid fa-chart-pie"></i> Hisab Kitab</a>
            </li>
            <li><a href="#" onclick="switchView('customers')"><i class="fa-solid fa-users"></i> Customers</a></li>
            <li><a href="#" onclick="switchView('ai-insights')"><i class="fa-solid fa-robot"></i> AI Insights</a></li>
            <li><a href="#" onclick="switchView('contact-settings')"><i class="fa-solid fa-address-book"></i> Contact
                    Settings</a></li>
        </ul>
    </aside>

    <main class="main-content" id="main-content">
        <!-- Content Injected via JS -->
    </main>

    <!-- Product Modal (Add/Edit) -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Add Product</h2>
                <button class="modal-close" onclick="closeModal('product-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="product-form" onsubmit="handleProductSubmit(event)">
                    <input type="hidden" id="product-id">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="product-name" required>
                    </div>
                    <div class="form-group">
                        <label>Brand Name</label>
                        <input type="text" id="product-brand" placeholder="e.g., Chanel, Dior, Versace" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="product-category" required>
                            <option value="Unisex">Unisex</option>
                            <option value="Men">Men</option>
                            <option value="Women">Women</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Selling Price (PKR)</label>
                        <input type="number" id="product-price" required min="0" step="1">
                    </div>
                    <div class="form-group">
                        <label>Cost Price (Asal Qeemat)</label>
                        <input type="number" id="product-cost" required min="0" step="1"
                            placeholder="Profit calculation ke liye zaroori hai">
                    </div>
                    <div class="form-group">
                        <label>Image Link Address</label>
                        <input type="url" id="product-image" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="product-stock" required min="0">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal('product-modal')">Cancel</button>
                <button type="submit" form="product-form" class="btn-save">Save Product</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal" style="width:400px;">
            <div class="modal-header" style="background:var(--danger-color);">
                <h2>Confirm Delete</h2>
                <button class="modal-close" onclick="closeModal('delete-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this product? This action cannot be undone.</p>
                <input type="hidden" id="delete-product-id">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal('delete-modal')">Cancel</button>
                <button type="button" class="btn-confirm-delete" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script src="admin-script.js"></script>
</body>

</html>
