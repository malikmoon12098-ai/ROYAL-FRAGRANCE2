<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ROYAL FRAGRANCE</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container {
            max-width: 900px;
            margin: 4rem auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 3rem;
        }

        .checkout-form {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: var(--font-body);
        }

        .order-summary {
            background: #f9f9f9;
            padding: 2rem;
            border-radius: 8px;
            height: fit-content;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .total-row {
            font-weight: 700;
            font-size: 1.2rem;
            border-top: 2px solid #ddd;
            padding-top: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                grid-row: 1;
            }
        }
    </style>
</head>

<body>

    <header class="main-header">
        <div class="container nav-container">
            <a href="index.html" class="logo">ROYAL FRAGRANCE</a>
        </div>
    </header>

    <div class="container checkout-container">

        <!-- Checkout Form -->
        <div class="checkout-form">
            <h2 style="margin-bottom:1.5rem;">Shipping Details</h2>
            <form id="checkout-form" onsubmit="handleCheckout(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="customer-name" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="customer-email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number / WhatsApp</label>
                    <input type="tel" id="customer-phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="customer-address" name="address" required>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <select id="customer-city" name="city">
                        <option>Karachi</option>
                        <option>Lahore</option>
                        <option>Islamabad</option>
                        <option>Other</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Place Order</button>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="order-summary">
            <h3 style="margin-bottom:1.5rem;">Order Summary</h3>
            <div id="checkout-items">
                <!-- Items injected -->
            </div>
            <div class="summary-row total-row">
                <span>Total</span>
                <span id="checkout-total">$0.00</span>
            </div>
        </div>

    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
    <script>
        // Checkout specific logic
        document.addEventListener('DOMContentLoaded', () => {
            const cart = JSON.parse(localStorage.getItem('rf_cart')) || [];
            const container = document.getElementById('checkout-items');
            const totalEl = document.getElementById('checkout-total');

            let total = 0;
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<p>Your cart is empty.</p>';
            } else {
                cart.forEach(item => {
                    const itemTotal = item.price * (item.qty || 1);
                    total += itemTotal;
                    container.innerHTML += `
                        <div class="summary-row">
                            <span>${item.name} x ${item.qty || 1}</span>
                            <span>PKR ${itemTotal.toLocaleString()}</span>
                        </div>
                    `;
                });
            }
            totalEl.textContent = 'PKR ' + total.toLocaleString();
        });

        function handleCheckout(e) {
            e.preventDefault();

            // 1. Capture Form Data using IDs
            const name = document.getElementById('customer-name').value.trim();
            const email = document.getElementById('customer-email').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const city = document.getElementById('customer-city').value;

            // 2. Get Cart Data
            const cart = JSON.parse(localStorage.getItem('rf_cart')) || [];
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * (item.qty || 1)), 0);

            // 3. Create Order Object
            const newOrder = {
                id: Date.now(), // Unique ID
                date: new Date().toISOString().split('T')[0],
                status: 'Pending', // Default Status
                total: totalAmount,
                customer: {
                    name: name,
                    email: email,
                    phone: phone,
                    address: address,
                    city: city
                },
                items: cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    qty: item.qty || 1
                }))
            };

            // 4. Save to LocalStorage (rf_orders)
            const orders = JSON.parse(localStorage.getItem('rf_orders')) || [];
            orders.unshift(newOrder); // Add to beginning
            localStorage.setItem('rf_orders', JSON.stringify(orders));

            console.log('✅ Order saved successfully:', newOrder);
            console.log('📦 Total orders in storage:', orders.length);

            // 5. UI Feedback & Redirect to Confirmation Page
            const btn = document.querySelector('button[type="submit"]');
            btn.textContent = 'Processing...';
            btn.disabled = true;

            setTimeout(() => {
                localStorage.removeItem('rf_cart'); // Clear cart
                window.location.href = `order-confirmed.html?id=${newOrder.id}`;
            }, 1000);
        }
    </script>
</body>

</html>
