<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ROYAL FRAGRANCE</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container {
            max-width: 900px;
            margin: 4rem auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 3rem;
        }

        .checkout-form {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: var(--font-body);
        }

        .order-summary {
            background: #f9f9f9;
            padding: 2rem;
            border-radius: 8px;
            height: fit-content;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .total-row {
            font-weight: 700;
            font-size: 1.2rem;
            border-top: 2px solid #ddd;
            padding-top: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                grid-row: 1;
            }
        }
    </style>
</head>

<body>

    <header class="main-header">
        <div class="container nav-container">
            <a href="index.html" class="logo">ROYAL FRAGRANCE</a>
        </div>
    </header>

    <div class="container checkout-container">

        <!-- Checkout Form -->
        <div class="checkout-form">
            <h2 style="margin-bottom:1.5rem;">Shipping Details</h2>
            <form id="checkout-form" onsubmit="handleCheckout(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number / WhatsApp</label>
                    <input type="tel" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <select>
                        <option>Karachi</option>
                        <option>Lahore</option>
                        <option>Islamabad</option>
                        <option>Other</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Place Order</button>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="order-summary">
            <h3 style="margin-bottom:1.5rem;">Order Summary</h3>
            <div id="checkout-items">
                <!-- Items injected -->
            </div>
            <div class="summary-row total-row">
                <span>Total</span>
                <span id="checkout-total">$0.00</span>
            </div>
        </div>

    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
    <script>
        // Checkout specific logic
        document.addEventListener('DOMContentLoaded', () => {
            const cart = JSON.parse(localStorage.getItem('rf_cart')) || [];
            const container = document.getElementById('checkout-items');
            const totalEl = document.getElementById('checkout-total');

            let total = 0;
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<p>Your cart is empty.</p>';
            } else {
                cart.forEach(item => {
                    const itemTotal = item.price * (item.qty || 1);
                    total += itemTotal;
                    container.innerHTML += `
                        <div class="summary-row">
                            <span>${item.name} x ${item.qty || 1}</span>
                            <span>PKR ${itemTotal.toLocaleString()}</span>
                        </div>
                    `;
                });
            }
            totalEl.textContent = 'PKR ' + total.toLocaleString();
        });

        function handleCheckout(e) {
            e.preventDefault();

            // Simulating Order Processing
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            btn.disabled = true;

            setTimeout(() => {
                alert('Order Placed Successfully! You will receive a WhatsApp confirmation shortly.');
                localStorage.removeItem('rf_cart'); // Clear cart
                window.location.href = 'index.html';
            }, 2000);
        }
    </script>
</body>

</html>
