<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4fb087">
    <title>M-Chat | Messenger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- MQTT.js Web SDK -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('Service Worker Registered');
        });
      }
    </script>
</head>
<body class="dark-theme">
    
    <!-- Splash Screen -->
    <div id="splash-screen" class="screen active">
        <div class="splash-content">
            <div class="logo-container">
                <svg viewBox="0 0 24 24" width="100" height="100" fill="var(--primary)">
                    <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91v-.05c-.05-5.46-4.5-9.87-9.91-9.87zm4.71 13.5c-.21.58-1.17 1.08-1.71 1.13-.5.04-1.17.21-3.38-.67-2.67-1.04-4.38-3.79-4.5-3.96-.13-.17-1.08-1.42-1.08-2.71s.67-1.92.92-2.17c.25-.25.54-.29.75-.29.21 0 .42 0 .58.04.21.04.46-.08.71.5.29.71.96 2.33 1.04 2.5.08.17.13.38 0 .63-.13.25-.25.38-.38.54-.13.17-.29.33-.42.46-.13.13-.29.29-.13.58.17.29.71 1.21 1.54 1.96.96.88 1.92 1.17 2.21 1.29.29.13.58.08.79-.13.21-.21.92-1.08 1.17-1.46.25-.38.5-.29.75-.21.25.08 1.58.75 1.83.88.25.13.42.21.5.33.08.13.08.67-.13 1.25z" />
                </svg>
            </div>
            <h1 class="glow-text">M-Chat</h1>
            <div class="loader"></div>
        </div>
    </div>

    <!-- Onboarding Screen -->
    <div id="onboarding-screen" class="screen">
        <div class="onboarding-card glass">
            <h2>Welcome to M-Chat</h2>
            <p>Enter your name to generate your unique ID</p>
            <div class="input-group">
                <input type="text" id="user-name-input" placeholder="Your Name" autocomplete="off">
            </div>
            <button id="generate-id-btn" class="primary-btn">Generate Account</button>
            <div id="onboarding-status" class="status-msg"></div>
        </div>
    </div>

    <!-- Registration Success Screen -->
    <div id="success-screen" class="screen">
        <div class="success-card glass">
            <div class="success-icon">✓</div>
            <h2>Account Created!</h2>
            <p>Your unique M-Chat ID is:</p>
            <div class="generated-id-box" id="display-id">0200000000</div>
            <p class="small-hint">Safe this ID for your records.</p>
            <button id="start-chatting-btn" class="primary-btn">Start Chatting</button>
        </div>
    </div>

    <!-- Main Message App -->
    <div id="app-screen" class="screen fade-in">
        <nav class="app-header glass">
            <div class="header-left">
                <div class="profile-pic-container">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Profile" id="my-profile-pic">
                </div>
                <div class="header-title">
                    <h1 id="my-name-display">M-Chat</h1>
                    <span id="my-id-display" class="id-badge">0200xxxxxxxx</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn search-trigger"><i class="search-icon"></i></button>
                <button class="icon-btn more-trigger"><i class="more-icon"></i></button>
            </div>
        </nav>

        <main id="chat-list-container">
            <div class="search-bar-container">
                <div style="display:flex; gap:10px;">
                    <input type="text" placeholder="Enter friend's 0200 ID..." id="new-chat-input" style="flex:1;">
                    <button id="add-friend-btn" class="primary-btn" style="width: auto; padding: 10px 15px;">Start Chat</button>
                </div>
            </div>
            <div id="chat-items-list">
                <!-- Chat items will be injected here -->
                <div class="chat-item ripple">
                    <div class="avatar-box">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sarah" alt="Sarah">
                    </div>
                    <div class="chat-info">
                        <div class="chat-top">
                            <span class="chat-name">System Bot</span>
                            <span class="chat-time">12:45 PM</span>
                        </div>
                        <div class="chat-bottom">
                            <span class="chat-preview">Welcome to M-Chat! Start messaging.</span>
                            <span class="unread-count">1</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-tab-bar glass">
            <button class="tab-btn active" data-tab="chats">Chats</button>
            <button class="tab-btn" data-tab="calls">Calls</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
        </footer>
    </div>

    <!-- Chat View (Hidden by default) -->
    <div id="chat-view" class="overlay-screen">
        <nav class="chat-header glass">
            <button id="back-to-list" class="icon-btn back-btn">←</button>
            <div class="chat-header-info">
                <img src="" alt="" id="active-chat-avatar" class="mini-avatar">
                <div class="chat-header-text">
                    <h2 id="active-chat-name">Recipient Name</h2>
                    <span class="online-status">online</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn"><i class="call-icon"></i></button>
                <button class="icon-btn"><i class="video-icon"></i></button>
            </div>
        </nav>
        
        <div id="message-container">
            <!-- Messages injected here -->
        </div>

        <div class="input-area glass">
            <button class="icon-btn attach-btn">+</button>
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="send-btn" class="icon-btn send-btn">➤</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
