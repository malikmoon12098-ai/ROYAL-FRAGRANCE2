<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | ROYAL FRAGRANCE</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <style>
        /* Shop Specific Styles */
        .shop-header {
            background-color: var(--color-primary);
            color: var(--color-gold);
            padding: var(--spacing-lg) 0;
            text-align: center;
        }

        .shop-header h1 {
            color: var(--color-gold);
            margin-bottom: 0.5rem;
        }

        .shop-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
            margin-top: var(--spacing-md);
        }

        .filters {
            border-right: 1px solid #eee;
            padding-right: 1rem;
        }

        .filter-group {
            margin-bottom: 2rem;
        }

        .filter-group h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--color-gold);
            display: inline-block;
            padding-bottom: 0.2rem;
        }

        .filter-list li {
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-list li:hover,
        .filter-list li.active {
            color: var(--color-primary);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .shop-layout {
                grid-template-columns: 1fr;
            }

            .filters {
                display: none;
                /* Todo: Add Mobile Filter Toggle */
            }
        }
    </style>
</head>

<body>

    <!-- Notification Bar -->
    <div class="top-bar">
        <p>Complimentary Shipping on Orders Over PKR 10,000</p>
    </div>

    <!-- Navigation -->
    <header class="main-header">
        <div class="container nav-container">
            <button class="menu-toggle" aria-label="Open Menu"><i class="fa-solid fa-bars"></i></button>
            <a href="index.html" class="logo">ROYAL FRAGRANCE</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html" class="active">Shop</a></li>
                    <li><a href="track-order.html">Track Order</a></li>
                    <li><a href="story.html">Our Story</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button class="cart-btn">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Page Header -->
    <header class="shop-header">
        <div class="container">
            <h1>The Collection</h1>
            <p>Curated scents for every soul.</p>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="container" style="margin-top: 2rem;">
        <div style="position: relative; max-width: 600px; margin: 0 auto;">
            <i class="fa-solid fa-search"
                style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 1rem;"></i>
            <input type="text" id="search-input" placeholder="Search by product name, brand, or category..."
                style="width: 100%; padding: 1rem 1rem 1rem 3rem; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50px; color: #fff; font-size: 1rem; outline: none; transition: all 0.3s;">
        </div>
    </div>

    <!-- Shop Content -->
    <div class="container shop-layout">
        <!-- Sidebar Filters -->
        <aside class="filters">
            <div class="filter-group">
                <h3>Brand</h3>
                <ul class="filter-list" id="brand-filter">
                    <li class="active" data-brand="all">All Brands</li>
                    <!-- Brands will be dynamically populated -->
                </ul>
            </div>
            <div class="filter-group">
                <h3>Gender</h3>
                <ul class="filter-list" id="gender-filter">
                    <li class="active" data-gender="all">All</li>
                    <li data-gender="Men">Men</li>
                    <li data-gender="Women">Women</li>
                    <li data-gender="Unisex">Unisex</li>
                </ul>
            </div>
        </aside>

        <!-- Product Grid -->
        <main>
            <div class="product-grid" id="shop-grid">
                <!-- Products injected via JS -->
                <div class="loading-spinner">Loading Collection...</div>
            </div>
        </main>
    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
    <script>
        let allProducts = [];
        let currentFilters = {
            search: '',
            brand: 'all',
            gender: 'all'
        };

        document.addEventListener('DOMContentLoaded', () => {
            // Check if products loaded correctly
            if (typeof products !== 'undefined' && typeof renderProducts === 'function') {
                allProducts = products;

                // Populate brand filter dynamically
                populateBrandFilter();

                // Initial render
                applyFilters();

                // Setup search functionality
                const searchInput = document.getElementById('search-input');
                if (searchInput) {
                    searchInput.addEventListener('input', (e) => {
                        currentFilters.search = e.target.value.toLowerCase();
                        applyFilters();
                    });

                    // Add focus effect
                    searchInput.addEventListener('focus', (e) => {
                        e.target.style.borderColor = '#6366f1';
                        e.target.style.boxShadow = '0 0 0 3px rgba(99, 102, 241, 0.2)';
                    });

                    searchInput.addEventListener('blur', (e) => {
                        e.target.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                        e.target.style.boxShadow = 'none';
                    });
                }

                // Setup brand filter clicks
                const brandFilter = document.getElementById('brand-filter');
                if (brandFilter) {
                    brandFilter.addEventListener('click', (e) => {
                        if (e.target.tagName === 'LI') {
                            // Remove active from all
                            brandFilter.querySelectorAll('li').forEach(li => li.classList.remove('active'));
                            // Add active to clicked
                            e.target.classList.add('active');
                            // Update filter
                            currentFilters.brand = e.target.dataset.brand;
                            applyFilters();
                        }
                    });
                }

                // Setup gender filter clicks
                const genderFilter = document.getElementById('gender-filter');
                if (genderFilter) {
                    genderFilter.addEventListener('click', (e) => {
                        if (e.target.tagName === 'LI') {
                            // Remove active from all
                            genderFilter.querySelectorAll('li').forEach(li => li.classList.remove('active'));
                            // Add active to clicked
                            e.target.classList.add('active');
                            // Update filter
                            currentFilters.gender = e.target.dataset.gender;
                            applyFilters();
                        }
                    });
                }
            } else {
                console.error("Products or render function missing.");
                document.getElementById('shop-grid').innerHTML = "<p>Error loading products. Please try again.</p>";
            }
        });

        function populateBrandFilter() {
            const brandFilter = document.getElementById('brand-filter');
            if (!brandFilter) return;

            // Get unique brands
            const brands = [...new Set(allProducts.map(p => p.brand).filter(b => b))];

            // Add brand items
            brands.forEach(brand => {
                const li = document.createElement('li');
                li.textContent = brand;
                li.dataset.brand = brand;
                brandFilter.appendChild(li);
            });
        }

        function applyFilters() {
            let filtered = allProducts;

            // Apply search filter
            if (currentFilters.search) {
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(currentFilters.search) ||
                    (p.brand && p.brand.toLowerCase().includes(currentFilters.search)) ||
                    p.category.toLowerCase().includes(currentFilters.search)
                );
            }

            // Apply brand filter
            if (currentFilters.brand !== 'all') {
                filtered = filtered.filter(p => p.brand === currentFilters.brand);
            }

            // Apply gender filter
            if (currentFilters.gender !== 'all') {
                filtered = filtered.filter(p => p.category === currentFilters.gender);
            }

            // Render filtered products
            renderProducts('shop-grid', filtered);
        }
    </script>
</body>

</html>
